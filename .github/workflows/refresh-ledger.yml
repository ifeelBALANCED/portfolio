name: Refresh pull request ledger

# Keeps the open-source ledger honest: re-reads PR states from GitHub weekly,
# verifies the site still builds, and pushes. The push redeploys via Vercel.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ledger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ledger:refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/ledger.json; then
            echo "No ledger changes."
            exit 0
          fi
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ledger.json
          git commit -m "chore: refresh pull request ledger"
          git push
