name: Refresh pull request ledger

# Keeps the open-source ledger honest: re-reads PR states from GitHub weekly,
# verifies the site still builds, and pushes. The push redeploys via Vercel.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ledger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ledger:refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/ledger.json; then
            echo "No ledger changes."
            exit 0
          fi
          pnpm test
          pnpm build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ledger.json
          git commit -m "chore: refresh pull request ledger"
          git push
